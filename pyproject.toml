[project]
name = "research-lab-agents"
version = "1.0.0"
description = "Hands-on workshop: MCP, A2A and x402 through an autonomous research lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]==2.3.0",
    "a2a-sdk[http-server]==1.2.2",
    "x402[evm,fastapi,httpx]==2.25.0",
    "openai==3.26.0",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "eth-account>=0.13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
